AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BreatheEasySG notifications API

Parameters:
  UserPoolArn:
    Type: String
    Description: ARN of the Cognito user pool that signs users in

  AllowedOrigins:
    Type: String
    Default: http://localhost:5173,http://localhost:5174
    Description: Frontend addresses allowed to call this API

Globals:
  Function:
    Timeout: 10
    MemorySize: 256

Resources:
  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: userID
          AttributeType: S
        - AttributeName: endpoint
          AttributeType: S

      KeySchema:
        - AttributeName: userID
          KeyType: HASH
        - AttributeName: endpoint
          KeyType: RANGE

  NotificationsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod

      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false

        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn

  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: main.handler
      Runtime: python3.12
      Architectures:
        - x86_64

      Environment:
        Variables:
          TABLE_NAME: !Ref PushSubscriptionsTable
          ALLOWED_ORIGINS: !Ref AllowedOrigins

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt PushSubscriptionsTable.Arn

      Events:
        SubscribePush:
          Type: Api
          Properties:
            RestApiId: !Ref NotificationsApi
            Path: /api/push/subscribe
            Method: post

Outputs:
  NotificationsApiUrl:
    Description: URL of the notifications API
    Value: !Sub "https://${NotificationsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod"

  PushSubscriptionsTableName:
    Description: DynamoDB table storing browser push subscriptions
    Value: !Ref PushSubscriptionsTable