# Tells AWS Amplify how to build and host the app in frontend/.
#
# One-time setup in the Amplify console (these can't go in this file):
#   1. App settings > Environment variables: AMPLIFY_MONOREPO_APP_ROOT=frontend, plus the VITE_* values from frontend/.env.example.
#   2. Hosting > Rewrites and redirects: add a 200 (Rewrite) rule so page refreshes on /dashboard etc. load the app:
#        source  </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>
#        target  /index.html
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
