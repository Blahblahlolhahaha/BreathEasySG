AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BreathEasySG alerts API (POST /api/alerts/check). Alert state is stored in the users table as alertState.

Parameters:
  UserPoolArn:
    Type: String
    Description: ARN of the Cognito user pool that signs users in
  UsersTableName:
    Type: String
    Description: Name of the users table (owned by the profile template)
  LocationsTableName:
    Type: String
    Description: Name of the locations table
  PSIApi:
    Type: String
    Description: URL of the PSI service this function calls
  DynamoEndpoint:
    Type: String
    Default: ""
    Description: Leave empty on AWS. For local use, e.g. http://dynamodb-local:8000
  DevUserId:
    Type: String
    Default: ""
    Description: LOCAL TESTING ONLY. Fake userId used when there is no Cognito login. Leave empty on AWS.

Globals:
  Function:
    Timeout: 29 # API Gateway cuts off at 29s; several PSI fetches may take a while
    MemorySize: 256

Resources:
  AlertsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn

  AlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: main.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTableName
          LOCATIONS_TABLE_NAME: !Ref LocationsTableName
          PSI_API: !Ref PSIApi
          DYNAMODB_ENDPOINT: !Ref DynamoEndpoint
          DEV_USER_ID: !Ref DevUserId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}"
        - DynamoDBReadPolicy:
            TableName: !Ref LocationsTableName
      Events:
        CheckAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref AlertsApi
            Path: /api/alerts/check
            Method: post

Outputs:
  AlertsApiUrl:
    Description: Put this in VITE_ALERTS_API_URL (or VITE_API_URL once everything shares one API)
    Value: !Sub "https://${AlertsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod"
