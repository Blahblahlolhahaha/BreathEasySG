AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  PSI API backed by the shared psi_data DynamoDB table managed by the refresher stack.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  PsiDataTableName:
    Type: String
    Default: psi_data
    MinLength: 3
    MaxLength: 255
    AllowedPattern: '[a-zA-Z0-9_.-]+'
    Description: Existing DynamoDB table in the same AWS account and Region
  AllowedOrigins:
    Type: String
    Default: http://localhost:5173,http://localhost:5174,https://breatheeasysg.d246hw8ikeq45d.amplifyapp.com
    Description: Website addresses allowed to call this API (comma-separated, no spaces)

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Resources:
  PSIFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: ./psi
      Handler: main.handler
      Runtime: python3.14
      Architectures:
        - x86_64
      # The refresher stack owns the table; this API only reads its snapshots.
      Environment:
        Variables:
          PSI_TABLE_NAME: !Ref PsiDataTableName
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PsiDataTableName
      Events:
        PSI:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /api/{proxy+}
            Method: any
    Metadata:
      BuildMethod: python-uv

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  PSIApi:
    Description: "API Gateway endpoint URL for Prod stage for Hello World function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/api/"
  PSIFunction:
    Description: "Hello World Lambda Function ARN"
    Value: !GetAtt PSIFunction.Arn
  PSIFunctionIamRole:
    Description: "Implicit IAM Role created for Hello World function"
    Value: !GetAtt PSIFunctionRole.Arn
